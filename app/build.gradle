plugins { id 'com.android.application' }

// Optional smaller device package; absent keeps the universal app and CI renderer.
def sleepwellAbi = providers.gradleProperty('sleepwellAbi').getOrElse('')
if (sleepwellAbi && !['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].contains(sleepwellAbi)) {
    throw new GradleException('sleepwellAbi must be arm64-v8a, armeabi-v7a, x86 or x86_64')
}

android {
    namespace 'org.sleepwell.app'
    compileSdk 36
    defaultConfig {
        applicationId 'org.sleepwell.app'
        minSdk 30
        targetSdk 36
        versionCode 23
        versionName '0.1.22'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (sleepwellAbi) { ndk { abiFilters.add(sleepwellAbi) } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-nearby:19.5.1'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.camera:camera-mlkit-vision:1.5.3'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
