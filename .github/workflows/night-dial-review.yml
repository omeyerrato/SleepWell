name: Night Dial design review
on:
  push:
    branches: [codex/night-dial-design]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-dial-design-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native app and review tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain --max-workers=2
      - name: Check contrast and existing interval semantics
        run: ./gradlew testDebugUnitTest --tests org.sleepwell.app.NightDialContrastTest --tests org.sleepwell.app.NightWindowTest --console=plain --max-workers=2
      - name: Create disposable renderer
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-night-dial-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/night-dial-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --name NightDialReview --path "$ANDROID_AVD_HOME/NightDialReview.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
      - name: Capture native flows without playback or sensor output
        run: python3 scripts/night_dial_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-dial-native-review
          path: captures/night-dial/
          retention-days: 14
