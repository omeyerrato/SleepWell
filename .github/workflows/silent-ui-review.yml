name: Silent Android visual review
run-name: "Silent Android review (${{ inputs.scope || 'full' }})"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Full acceptance or a clearly labelled focused UI correction run'
        type: choice
        default: full
        options:
          - full
          - tone-wake
          - report
          - report-flow
          - organization
          - organized-settings
          - automation-rules
          - recorded-analysis
          - challenge-routine
          - math-owner
          - challenge-selection
          - tonight
          - tonight-composition
          - appearance
          - event-library
          - goal-plan
          - interaction-security
          - priority-menus
          - priority-current
          - priority-repair
          - reference-menus
          - privacy-recovery
          - setup-readiness
          - readiness-recovery
          - sensing-reference
          - contactless-status
          - room-bedtime-live
          - room-bedtime-repair
          - bedtime-navigation
          - label-navigation
          - live-night-timeline
          - chart-phone-motion
          - wake-challenge-reference
          - calendar-consent-recovery
          - profile-room-dimming
          - room-settings-search
          - feature-search
          - editor-usability-integration
          - sensing-travel
          - travel-ui
          - travel-cue-cleanup
          - sonar-night
          - sound-categories
          - sound-sensitivity
          - phone-features
          - feature-increment
          - nap-features
      native_sounds:
        description: 'Also exercise real MediaPlayer/notification controls with host audio disabled (CI emulator only)'
        type: boolean
        default: false
      audio_imports:
        description: 'Also verify the real document picker and imported playback with a process restart (CI emulator only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  silent-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build application and allowlisted test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Configure isolated Android renderer
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-sleepwell-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sleepwell-avds"
          export ANDROID_USER_HOME="$RUNNER_TEMP/sleepwell-android"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd --name SleepWellSilent --path "$ANDROID_AVD_HOME/SleepWellSilent.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_7 --force
      - name: Allowlisted UI checks and real Android captures
        env:
          REVIEW_SCOPE: ${{ inputs.scope }}
          NATIVE_SOUNDS: ${{ inputs.native_sounds }}
          AUDIO_IMPORTS: ${{ inputs.audio_imports }}
        run: |
          options=()
          if [ "$NATIVE_SOUNDS" = "true" ]; then options+=(--native-sounds); fi
          if [ "$AUDIO_IMPORTS" = "true" ]; then options+=(--audio-imports); fi
          python3 scripts/ci_silent_ui.py --serial emulator-5554 --scope "${REVIEW_SCOPE:-full}" "${options[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-android-review
          path: captures/ci/
          retention-days: 7
