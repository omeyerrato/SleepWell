name: Silent Android visual review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  silent-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build application and allowlisted test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Start isolated Android renderer with audio disabled
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-sleepwell-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo no | avdmanager create avd --name SleepWellSilent --package 'system-images;android-36;google_apis;x86_64' --device pixel_7 --force
          "$ANDROID_HOME/emulator/emulator" -avd SleepWellSilent -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -timezone Asia/Riyadh > "$RUNNER_TEMP/emulator.log" 2>&1 &
      - name: Configuration-only UI checks and real Android captures
        run: python3 scripts/ci_silent_ui.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-android-review
          path: captures/ci/
          retention-days: 7
