name: Silent Android visual review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  silent-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/sleepwell-avds
      ANDROID_USER_HOME: ${{ runner.temp }}/sleepwell-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build application and allowlisted test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Configure isolated Android renderer
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-sleepwell-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd --name SleepWellSilent --path "$ANDROID_AVD_HOME/SleepWellSilent.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_7 --force
      - name: Configuration-only UI checks and real Android captures
        run: python3 scripts/ci_silent_ui.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silent-android-review
          path: captures/ci/
          retention-days: 7
