name: Android checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run the deferred unit and lint checks as well as the APK build'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sleepwell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
